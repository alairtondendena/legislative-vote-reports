name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version and the one in the Docker image.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # publishes exact versions only, no moving major tag
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  docker:
    name: Docker Compose services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the checks in the image
        run: docker compose run --rm --build check
      - name: Regenerate the reports
        run: docker compose run --rm --build reports
      - name: Reports are unchanged and owned by the runner's user, not root
        run: |
          git diff --exit-code output/
          for report in output/*.csv; do
            test "$(stat -c %u "$report")" = "$(id -u)"
          done
