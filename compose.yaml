name: vote-reports

services:
  # Writes the reports from ./data into ./output:
  #   docker compose run --rm reports
  reports:
    build:
      context: .
      target: app
    # Runs as root, so it can write to ./output whatever the host user's uid, then gives
    # the reports to the owner of ./output, so they are not left owned by root.
    # ($$ escapes $ for Compose; extra arguments reach the program through "$@".)
    entrypoint:
      - sh
      - -c
      - python -m vote_reports "$$@" && chown -R "$$(stat -c %u:%g output)" output
      - vote_reports
    volumes:
      - ./data:/app/data:ro
      - ./output:/app/output

  # Runs ruff, mypy and the test suite:
  #   docker compose run --rm check
  check:
    build:
      context: .
      target: check
